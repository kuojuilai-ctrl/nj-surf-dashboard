<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NJ Surf Dashboard - Manasquan</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white p-6">

    <h1 class="text-3xl font-bold mb-6 text-blue-400">🌊 NJ Surf Dashboard (Manasquan)</h1>

    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
        
        <!-- 區塊 1：即時影像 (退回你測試成功的完美遮罩比例) -->
        <div class="bg-gray-800 p-4 rounded-lg shadow-lg">
            <h2 class="text-xl font-semibold mb-3">📷 即時影像 (Manasquan Inlet)</h2>
            
            <!-- 使用你驗證過的 aspect-ratio: 16/9 與相對寬度 -->
            <div style="width: 100%; aspect-ratio: 16/9; overflow: hidden; position: relative; border-radius: 8px; background-color: #000;">
                <iframe src="https://njbeachcams.com/central-new-jersey/manasquan-inlet-cam/"
                        style="position: absolute; top: -400px; left: -20px; width: 105%; height: 1200px; border: none;"
                        scrolling="no"
                        allow="autoplay; fullscreen">
                </iframe>
            </div>
            <p class="text-xs text-gray-500 mt-2">註：請直接點擊畫面中央的播放鍵。</p>
        </div>

        <!-- 區塊 2：Windy -->
        <div class="bg-gray-800 p-4 rounded-lg shadow-lg">
            <h2 class="text-xl font-semibold mb-3">🗺️ Windy 浪況與風場預測</h2>
            <div style="width: 100%; aspect-ratio: 16/9; position: relative; border-radius: 8px; overflow: hidden;">
                <iframe class="absolute top-0 left-0 w-full h-full border-none" 
                    src="https://embed.windy.com/embed.html?type=map&location=coordinates&metricRain=default&metricTemp=default&metricWind=default&zoom=11&overlay=waves&product=ecmwf&lat=40.103&lon=-74.032&detailLat=40.103&detailLon=-74.032&detail=true" 
                    allowfullscreen>
                </iframe>
            </div>
        </div>

        <!-- 區塊 3：Surfline 即時數據 -->
        <div class="bg-gray-800 p-4 rounded-lg shadow-lg lg:col-span-2">
            <h2 class="text-xl font-semibold mb-3">📊 Surfline 即時數值解析</h2>
            <div id="surfline-data" class="bg-gray-900 p-4 rounded font-mono text-sm text-green-400 min-h-[100px] flex items-center justify-center">
                正在連線後端 API 取得最新浪況...
            </div>
        </div>

    </div>

    <script>
        const spotId = "5842041f4e65fad6a7708856";
        
        fetch(`/api/surf?spotId=${spotId}`)
            .then(async response => {
                if (!response.ok) {
                    const errJson = await response.json();
                    throw new Error(errJson.error || `HTTP ${response.status}`);
                }
                return response.json();
            })
            .then(data => {
                const waveList = data?.data?.wave;
                if (!waveList || waveList.length === 0) throw new Error("無浪況資料");
                
                const currentWave = waveList[0];
                const swell = currentWave.swells?.[0] || { height: '--', period: '--', direction: '--' };

                document.getElementById('surfline-data').innerHTML = `
                    <div class="grid grid-cols-2 md:grid-cols-4 gap-4 text-center w-full">
                        <div class="bg-gray-800 p-3 rounded border border-gray-700">
                            <div class="text-gray-400 mb-1 text-xs">預報浪高</div>
                            <div class="text-2xl font-bold text-blue-400">${currentWave.surf?.min ?? '-'} - ${currentWave.surf?.max ?? '-'} <span class="text-xs text-gray-400">ft</span></div>
                        </div>
                        <div class="bg-gray-800 p-3 rounded border border-gray-700">
                            <div class="text-gray-400 mb-1 text-xs">主要湧浪 (Swell)</div>
                            <div class="text-base font-semibold text-white">${swell.height}ft @ ${swell.period}s</div>
                            <div class="text-xs text-gray-400">方向: ${swell.direction}°</div>
                        </div>
                        <div class="bg-gray-800 p-3 rounded border border-gray-700">
                            <div class="text-gray-400 mb-1 text-xs">浪況評級</div>
                            <div class="text-base font-semibold text-yellow-400">${currentWave.surf?.humanRelation || '一般'}</div>
                        </div>
                        <div class="bg-gray-800 p-3 rounded border border-gray-700">
                            <div class="text-gray-400 mb-1 text-xs">狀態評估</div>
                            <div class="text-base font-semibold text-white">${currentWave.surf?.optimalScore ? '適合下水' : '普通'}</div>
                        </div>
                    </div>
                `;
            })
            .catch(error => {
                document.getElementById('surfline-data').innerHTML = `
                    <div class="text-red-400 text-center">
                        <div>⚠️ 數據載入失敗</div>
                        <div class="text-xs text-gray-400 mt-1">${error.message}</div>
                    </div>
                `;
            });
    </script>
</body>
</html>
