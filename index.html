<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NJ Surf Dashboard - Manasquan</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white p-6">

    <h1 class="text-3xl font-bold mb-6 text-blue-400">🌊 NJ Surf Dashboard (Manasquan)</h1>

    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
        
        <!-- 區塊 1：即時影像 (絕對像素裁切法 - 保證可點擊) -->
        <div class="bg-gray-800 p-4 rounded-lg shadow-lg">
            <h2 class="text-xl font-semibold mb-3 flex items-center justify-between">
                <span>📷 即時影像 (Manasquan Inlet)</span>
            </h2>
            
            <!-- 觀景窗：固定高度，超出隱藏 -->
            <div style="position: relative; width: 100%; height: 380px; overflow: hidden; background: #000; border-radius: 8px;">
                <!-- 
                    將 iframe 設為超大固定尺寸 (1200px) 並往左上推移。
                    因為沒有使用 scale 縮放，瀏覽器的點擊座標完全不會跑掉！
                -->
                <iframe src="https://njbeachcams.com/central-new-jersey/manasquan-inlet-cam/"
                        style="position: absolute; width: 1200px; height: 1000px; top: -380px; left: -140px; border: none;"
                        scrolling="no">
                </iframe>
            </div>
            <p class="text-xs text-gray-500 mt-2">註：已修復點擊失效問題。請直接點擊畫面中央播放。</p>
        </div>

        <!-- 區塊 2：Windy -->
        <div class="bg-gray-800 p-4 rounded-lg shadow-lg">
            <h2 class="text-xl font-semibold mb-3">🗺️ Windy 浪況與風場預測</h2>
            <div class="relative w-full bg-gray-700 rounded overflow-hidden" style="height: 380px;">
                <iframe class="absolute top-0 left-0 w-full h-full border-none" 
                    src="https://embed.windy.com/embed.html?type=map&location=coordinates&metricRain=default&metricTemp=default&metricWind=default&zoom=11&overlay=waves&product=ecmwf&lat=40.103&lon=-74.032&detailLat=40.103&detailLon=-74.032&detail=true" 
                    allowfullscreen>
                </iframe>
            </div>
        </div>

        <!-- 區塊 3：Surfline 即時數據 -->
        <div class="bg-gray-800 p-4 rounded-lg shadow-lg lg:col-span-2">
            <h2 class="text-xl font-semibold mb-3">📊 Surfline 即時數值解析</h2>
            <div id="surfline-data" class="bg-gray-900 p-4 rounded font-mono text-sm text-green-400 min-h-[100px] flex items-center justify-center">
                正在連線後端 API 取得最新浪況...
            </div>
        </div>

    </div>

    <script>
        const spotId = "5842041f4e65fad6a7708856";
        
        fetch(`/api/surf?spotId=${spotId}`)
            .then(async response => {
                if (!response.ok) {
                    const errJson = await response.json();
                    throw new Error(errJson.error || `HTTP ${response.status}`);
                }
                return response.json();
            })
            .then(data => {
                // 配合新的 Reports API 結構提取資料
                const report = data?.data?.report;
                if (!report) {
                    throw new Error("回傳資料為空或結構已變更");
                }
                
                const wave = report.wave || {};
                const swells = report.swells || [];
                const primarySwell = swells[0] || { height: '--', period: '--', direction: '--' };

                document.getElementById('surfline-data').innerHTML = `
                    <div class="grid grid-cols-2 md:grid-cols-4 gap-4 text-center w-full">
                        <div class="bg-gray-800 p-3 rounded border border-gray-700">
                            <div class="text-gray-400 mb-1 text-xs">目前實測浪高</div>
                            <div class="text-2xl font-bold text-blue-400">${wave.min ?? '-'} - ${wave.max ?? '-'} <span class="text-xs text-gray-400">ft</span></div>
                        </div>
                        <div class="bg-gray-800 p-3 rounded border border-gray-700">
                            <div class="text-gray-400 mb-1 text-xs">主要湧浪 (Swell)</div>
                            <div class="text-base font-semibold text-white">${primarySwell.height}ft @ ${primarySwell.period}s</div>
                            <div class="text-xs text-gray-400">方向: ${primarySwell.direction}°</div>
                        </div>
                        <div class="bg-gray-800 p-3 rounded border border-gray-700">
                            <div class="text-gray-400 mb-1 text-xs">浪況評級</div>
                            <div class="text-base font-semibold text-yellow-400">${wave.humanRelation || '一般'}</div>
                        </div>
                        <div class="bg-gray-800 p-3 rounded border border-gray-700">
                            <div class="text-gray-400 mb-1 text-xs">測站更新時間</div>
                            <div class="text-base font-semibold text-white">${new Date(report.timestamp * 1000).toLocaleTimeString('zh-TW', {hour: '2-digit', minute:'2-digit'})}</div>
                        </div>
                    </div>
                `;
            })
            .catch(error => {
                document.getElementById('surfline-data').innerHTML = `
                    <div class="text-red-400 text-center">
                        <div>⚠️ 數據載入失敗</div>
                        <div class="text-xs text-gray-400 mt-1">${error.message}</div>
                    </div>
                `;
            });
    </script>
</body>
</html>
